<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    
 * {
    box-sizing: border-box;
} 

body {
    font-family: Arial, sans-serif;
    background-color: white;
    padding: 30px;
}

h1 {
    color: grey;
}

.box {
    width: 350px;
    padding: 25px;
    border: 8px solid blue;
    margin: 150px;
    background-color: rgb(0, 179, 255);
}

.box h2 {
    margin-top: 0;
    color: rgb(0, 76, 255);
}

.box p {
    margin-bottom: 0;
    line-height: 1.6;
}

</style>
<body>
    
    <h1>CSS Box Model Demo</h1>

    <div class="box">
        <h2>Hello CSS!</h2>
        <p>Experiment with padding, border and margin.</p>
    </div>

</body>
</html>
