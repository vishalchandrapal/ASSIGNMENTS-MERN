
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Grid </title>
    <style>
      
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: grid;

    grid-template-areas:
        "head head"
        "side main"
        "foot foot";

    grid-template-columns: 200px 2fr;
    grid-template-rows: 80px 400px 80px;

    gap: 10px;
    padding: 10px;
}

.head {
    grid-area: head;
    background-color: blue;
}

.side {
    grid-area: side;
    background-color:green;
}

.main {
    grid-area: main;
    background-color:yellow;
}

.foot {
    grid-area: foot;
    background-color: red;
}

.head, .side, .main, .foot {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
}

    </style>
</head>
<body>

    <div class="container">

        <header class="head">HEADER</header>

        <aside class="side">SIDEBAR</aside>

        <main class="main">MAIN CONTENT</main>
        
        <footer class="foot">FOOTER</footer>

    </div>

</body>
</html>
