
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid and Flexbox Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: grid;

    grid-template-areas:
        "head head"
        "side main"
        "foot foot";

    grid-template-columns: 200px 1fr;
    grid-template-rows: 80px 400px 80px;

    gap: 10px;
    padding: 10px;
}

.head {
    grid-area: head;
    background-color:blue;
}

.side {
    grid-area: side;
    background-color: green;
}

.main {
    grid-area: main;
    background-color: yellow;
}

.foot {
    grid-area: foot;
    background-color: red;
}

/* Flexbox inside every box */
.head, .side, .main, .foot {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 12px;

    font-size: 25px;
    font-weight: bold;
}

.icon {
    font-size: 30px;
}

</style>
<body>

    <div class="container">

        <header class="head">
            <span class="icon">🏠</span>
            <span>HEADER</span>
        </header>

        <aside class="side">
            <span class="icon">📋</span>
            <span>SIDEBAR</span>
        </aside>

        <main class="main">
            <span class="icon">💻</span>
            <span>MAIN CONTENT</span>
        </main>

        <footer class="foot">
            <span class="icon">📞</span>
            <span>FOOTER</span>
        </footer>

    </div>

</body>
</html>
