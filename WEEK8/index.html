
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
 
</head>
<style>
    
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    font-size: 1rem;
}

header {
    background-color: navy;
    color: white;
    text-align: center;
    padding: 1.25rem;
}

header h1 {
    font-size: 2rem;
}

nav {
    background-color: black;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 1rem;
}

.container {
    padding: 1rem;
}

.box {
    background-color: lightblue;
    padding: 1.25rem;
    margin-bottom: 1rem;
    text-align: center;
}

.box h2 {
    font-size: 1.5rem;
}

.box p {
    font-size: 1rem;
}


img {
    max-width: 100%;
    height: auto;
    display: block;
}


@media (min-width: 768px) {
    nav {
        flex-direction: row;
        justify-content: center;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .box {
        width: calc(50% - 0.5rem);
    }
}

@media (min-width: 1024px) {
    .container {
        max-width: 75rem;
        margin: auto;
    }

    .box {
        width: calc(33.333% - 0.67rem);
    }
}

.box{
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.img{
    display: block;
    margin: 0 auto;
}

.image{
    max-width: 100%;
    height: auto;
}
</style>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main class="container">
        <div class="box">
            <h2>Easy Booking</h2>
            <img class="image"  src="https://cdn.pixabay.com/photo/2016/07/12/18/38/package-1512783_1280.png " height="100px" width="200px" alt="image1">
            <p>book in 3 clicks</p>
        </div>

        <div class="box">
            <h2>Best Prices</h2>
            <img class="image"  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHyWULV5Bt_mR4NI3tqQKpywj0KN_AFLPK6UMr6uCGajdKjZb9OmpI828&s=10" height="100px" width="200px" alt="image2">
            <p>we compare for you</p>
        </div>

        <div class="box">
            <h2>24x7 help</h2>
            <img class="image"  src="https://png.pngtree.com/png-vector/20200922/ourmid/pngtree-24-hour-clock-delivery-service-png-image_2347315.jpg"height="100px" width="200px" alt="image3">
            <p>always here to help you</p>
        </div>
    </main>

</body>
</html>
