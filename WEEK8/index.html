
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Landing Page</title>
   
</head>
<style>


* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    font-size: 1rem;
}

.navbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: navy;
    color: white;
    padding: 1rem;
}

.links {
    display: flex;
    gap: 1rem;
    background-color: black;
}

.links a {
    color: white;
    text-decoration: none;
}

.hero {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    padding: 2rem;
    text-align: center;
}

.hero h1 {
    font-size: 2rem;
}

button {
    padding: 0.7rem 1.2rem;
    background: navy;
    color: white;
    border: none;
}

img {
    max-width: 100%;
    height: auto;
}

.cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    padding: 1rem;
}

.card {
    background: red;
    padding: 2rem;
    text-align: center;
    font-size: 1.5rem;
}


footer {
    background: black;
    color: white;
    text-align: center;
    padding: 1rem;
}

@media (min-width: 768px) {

    .navbar {
        flex-direction: row;
        justify-content: space-between;
    }

    .hero {
        grid-template-columns: 1fr 1fr;
        align-items: center;
    }

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (min-width: 1024px) {

    .cards {
        grid-template-columns: repeat(3, 1fr);
    }

    .hero h1 {
        font-size: 3rem;
    }
}

</style>
<body>

    <nav class="navbar">
        <h2>MyWebsite</h2>
        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <div>
            <h1>Welcome to My Website</h1>
            <p>Learn and explore new things with us.</p>
            <button>Get Started</button>
        </div>

        <img src="https://4kwallpapers.com/images/walls/thumbs_2t/27522.jpg" height="300px" width="500px"
             alt="Website banner">
    </section>

    <section class="cards">
        <div class="card">HTML</div>
        <div class="card">CSS</div>
        <div class="card">JavaScript</div>
    </section>

    <footer>
        <p>2026 MyWebsite</p>
    </footer>

</body>
</html>
