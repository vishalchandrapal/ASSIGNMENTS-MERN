
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Cards</title>

</head>
<body>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px;
}

.card {
    flex: 1 1 200px;
    background-color: rgb(173, 183, 230);
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}

.card h2 {
    margin-bottom: 10px;
}

    </style>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Build the structure</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Make it beautiful</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Make it smart</p>
        </div>

        <div class="card">
            <h2>GIT</h2>
            <p>Save your work</p>
        </div>

    </div>

</body>
</html>
